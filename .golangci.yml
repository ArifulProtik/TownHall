version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
  exclusions:
    generated: lax
    rules:
      - path: _test\.go$
        linters: [errcheck]

# NOTE: gofumpt intentionally omitted (2026-09): golangci-lint v2.11.4
# reports nondeterministic gofumpt findings (random files per run) while
# standalone gofumpt v0.9.2/v0.12.0 and gofmt are clean. Re-add gofumpt
# after upgrading golangci past v2.11.4 and verifying stable runs.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - ArifulProtik/TownHall
